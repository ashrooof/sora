<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو البوستر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--panel:#fffdf8;--line:#e4dccb;--ink:#15213f;--mute:#7b7461;--gold:#b8914f;--gold2:#d6b46c;--on:#fffdf8;--sh:0 8px 24px rgba(40,30,10,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--panel:#17171c;--line:#2a2a32;--ink:#f1ead8;--mute:#9b957f;--gold:#d4a94f;--gold2:#ecd08a;--on:#1a1405;--sh:0 8px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0e0e11;--panel:#17171c;--line:#2a2a32;--ink:#f1ead8;--mute:#9b957f;--gold:#d4a94f;--gold2:#ecd08a;--on:#1a1405;--sh:0 8px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;max-width:860px;margin-inline:auto;padding:14px 14px 0;min-height:100vh}
h1{font-size:18px;margin:4px 2px 12px;font-weight:700;display:flex;align-items:center;gap:8px}
h1 i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.stage{border-radius:14px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);background:var(--panel);line-height:0}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.hint{font-size:12.5px;color:var(--mute);margin:10px 4px 0;min-height:18px;transition:opacity .3s}
.sheet{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1),opacity .3s,margin .35s;opacity:0;margin-top:0}
.sheet.open{grid-template-rows:1fr;opacity:1;margin-top:12px}
.sheet>div{overflow:hidden}
.sheet .in{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.sheet label{font-size:12px;color:var(--mute)}
.sheet input{font:inherit;font-size:15px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.sheet input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.bar{position:sticky;bottom:0;margin:14px -14px 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn{position:relative;overflow:hidden;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .25s;user-select:none}
.btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1),color .2s}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.10);border-color:var(--gold)}.btn:hover svg{color:var(--gold);transform:scale(1.08)}}
.btn:active{transform:scale(.94);box-shadow:none}
.btn.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.btn.main{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);border-color:transparent}
.btn.main svg{color:var(--on)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.7;pointer-events:none}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(8deg)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(5px)}70%{transform:translateY(-2px)}}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(.78)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(9deg)}}
.go-add svg{animation:pop .5s}.go-fill svg{animation:pulse .5s}.go-text svg{animation:wig .5s}.go-dl svg{animation:bounce .6s}
.spin svg{animation:spin .8s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.out{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.out.show{opacity:1;pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;width:min(520px,100%);max-height:92vh;overflow:auto;transform:translateY(14px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.out.show .card{transform:none}
.card img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.card p{font-size:13px;color:var(--mute);margin:10px 2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a,.row button{flex:1;min-width:110px;font:inherit;font-size:14px;font-weight:600;text-align:center;text-decoration:none;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:transform .2s}
.row a{background:var(--gold);color:var(--on);border-color:var(--gold)}
.row a:active,.row button:active{transform:scale(.95)}

.sig{display:flex;flex-direction:column;align-items:center;gap:0;margin:26px auto calc(16px + env(safe-area-inset-bottom,0px));width:max-content;text-decoration:none;color:var(--mute);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sig small{font-size:11.5px}
.sig svg{width:200px;height:auto;overflow:visible;display:block}
.pen path{fill:none;stroke:url(#sg);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.pen path.sw{stroke-width:1.8}
.dots circle{fill:url(#sg);transform-box:fill-box;transform-origin:center}
.sig.draw .pen path{animation:dr 1.1s cubic-bezier(.5,0,.2,1) both;animation-delay:calc(var(--i)*.3s)}
.sig.draw .dots circle{animation:fi .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:1.7s}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fi{from{opacity:0;transform:scale(.2)}}
@media (hover:hover){.sig:hover{transform:translateY(-3px)}}
.sig:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1><i></i>استوديو البوستر</h1>
<div class="stage"><canvas id="cv"></canvas></div>
<p class="hint" id="hint">اضغط على «إضافة صورة» لتبدأ.</p>

<div class="sheet" id="sheet"><div><div class="in">
<label for="l1">السطر الأول</label><input id="l1" autocomplete="off">
<label for="l2">السطر الثاني (كلمة ESMS تظهر بالذهبي)</label><input id="l2" autocomplete="off">
</div></div></div>

<nav class="bar">
<button class="btn" id="bAdd" data-go="add"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2.5"/><circle cx="8" cy="11" r="1.4"/><path d="M3 17l4-3.5 3.5 3 2.5-2L17 17"/><path d="M19 2.5v6M16 5.5h6"/></svg><span>إضافة صورة</span></button>
<button class="btn" id="bTxt" data-go="text"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg><span>تعديل النصوص</span></button>
<button class="btn" id="bFill" data-go="fill"><svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><rect x="8.5" y="8.5" width="7" height="7" rx="1.5"/></svg><span>ملء تلقائي</span></button>
<button class="btn main" id="bDl" data-go="dl"><svg viewBox="0 0 24 24" id="dlI"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg><span>تنزيل</span></button>
</nav>

<input type="file" id="file" accept="image/*" hidden>

const HOLE=[[0,150],[1448,150],[1448,900],[0,900]];
const HB={x:724,y:525,w:1448,h:750};
const BGC='#f6f2ea';
let W=1448,H=1086,ov=null,photo=null,T={l1:'خطوة جديدة لطلاب سنة أولى',l2:'لاكتشاف عالم البورصة مع ESMS'};
cv.width=W;cv.height=H;

const fontFor=(p,fs)=>p==='ESMS'?'700 '+Math.round(fs*1.1)+'px "Playfair Display",serif':'600 '+fs+'px Cairo,sans-serif';
function drawTitle(c){
  c.save();c.direction='rtl';c.textBaseline='middle';c.textAlign='left';
  [[T.l1,928],[T.l2,972]].forEach(([t,y])=>{
    if(!t.trim())return;
    const parts=t.split(/(ESMS)/).filter(p=>p!=='');
    const meas=f=>parts.map(p=>{c.font=fontFor(p,f);return c.measureText(p).width});
    let fs=34,ws=meas(fs),tot=ws.reduce((a,b)=>a+b,0);
    while(tot>460&&fs>16){fs--;ws=meas(fs);tot=ws.reduce((a,b)=>a+b,0)}
    let x=W/2+tot/2;
    parts.forEach((p,i)=>{x-=ws[i];c.font=fontFor(p,fs);c.fillStyle=p==='ESMS'?'#b8914f':'#14274e';c.fillText(p,x,y)});
  });
  c.restore();
}
function render(c,ui,k){
  c.save();c.scale(k,k);c.fillStyle=BGC;c.fillRect(0,0,W,H);
  if(photo){const w=photo.bw*photo.s,h=photo.bh*photo.s;c.save();c.translate(photo.x,photo.y);c.imageSmoothingQuality='high';c.drawImage(photo.img,-w/2,-h/2,w,h);c.restore()}
  else if(ui){
    c.save();c.fillStyle='#ece5d6';c.fillRect(0,175,W,705);
    c.strokeStyle='#b8914f';c.lineWidth=3;c.setLineDash([16,12]);c.strokeRect(40,215,W-80,625);c.setLineDash([]);
    c.strokeStyle='#b8914f';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(W/2-34,500);c.lineTo(W/2+34,500);c.moveTo(W/2,466);c.lineTo(W/2,534);c.stroke();
    c.fillStyle='#8a6d35';c.font='600 30px Cairo,sans-serif';c.textAlign='center';c.direction='rtl';c.fillText('اضغط هنا لإضافة صورتك',W/2,590);c.restore();
  }
  if(ov)c.drawImage(ov,0,0,W,H);
  drawTitle(c);c.restore();
}
function draw(){render(ctx,true,1)}

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function hint(t){$('hint').textContent=t}
let tw=0;
function tween(to,ms=380){
  const id=++tw,f={x:photo.x,y:photo.y,s:photo.s},t0=performance.now();
  (function step(n){
    if(id!==tw||!photo)return;
    let p=Math.min(1,(n-t0)/ms);p=1-Math.pow(1-p,3);
    photo.x=f.x+(to.x-f.x)*p;photo.y=f.y+(to.y-f.y)*p;photo.s=f.s+(to.s-f.s)*p;draw();
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function autoFill(){
  if(!photo){toast('أضف صورة أولًا');return}
  tween({x:HB.x,y:HB.y,s:1});hint('تم ضبط الصورة لتملأ التصميم. اسحبها أو كبّرها بإصبعين للتعديل.');
}
function loadPhoto(file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const k=Math.max(HB.w/img.naturalWidth,HB.h/img.naturalHeight);
    photo={img,nw:img.naturalWidth,nh:img.naturalHeight,bw:img.naturalWidth*k,bh:img.naturalHeight*k,s:1.15,x:HB.x,y:HB.y};
    draw();tween({x:HB.x,y:HB.y,s:1},450);
    hint('اسحب الصورة لتحريكها، وكبّرها بإصبعين، أو اضغط «ملء تلقائي».');
  };
  img.onerror=()=>toast('تعذّر فتح الصورة');
  img.src=url;
}

/* gestures */
const P=new Map();let g=null;
const cp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.width}};
function startG(){
  const a=[...P.values()];if(!photo||!a.length){g=null;return}
  if(a.length===1)g={m:'m',ox:a[0].x-photo.x,oy:a[0].y-photo.y};
  else g={m:'z',d0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,s0:photo.s};
}
cv.addEventListener('pointerdown',e=>{
  if(!photo){$('file').click();return}
  tw++;cv.setPointerCapture(e.pointerId);P.set(e.pointerId,cp(e));startG();cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId)||!photo||!g)return;P.set(e.pointerId,cp(e));const a=[...P.values()];
  if(g.m==='m'&&a.length===1){photo.x=a[0].x-g.ox;photo.y=a[0].y-g.oy}
  else if(g.m==='z'&&a.length>=2){photo.s=Math.max(.2,Math.min(6,g.s0*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/g.d0))}
  draw();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{P.delete(e.pointerId);startG();cv.style.cursor='grab'}));
cv.addEventListener('wheel',e=>{if(!photo)return;e.preventDefault();tw++;photo.s=Math.max(.2,Math.min(6,photo.s*(e.deltaY<0?1.06:.94)));draw()},{passive:false});

/* buttons: ripple + icon animation */
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,s=document.createElement('span');
    s.className='rp';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
    b.appendChild(s);setTimeout(()=>s.remove(),620);
  });
  b.addEventListener('click',()=>{const c='go-'+b.dataset.go;b.classList.remove(c);void b.offsetWidth;b.classList.add(c);setTimeout(()=>b.classList.remove(c),700)});
});
$('bAdd').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(f)loadPhoto(f);e.target.value=''};
$('bTxt').onclick=()=>{const o=$('sheet').classList.toggle('open');$('bTxt').classList.toggle('on',o);if(o)setTimeout(()=>$('l1').focus({preventScroll:true}),300)};
$('l1').value=T.l1;$('l2').value=T.l2;
$('l1').oninput=e=>{T.l1=e.target.value;draw()};
$('l2').oninput=e=>{T.l2=e.target.value;draw()};
$('bFill').onclick=autoFill;

/* download */
function closeOut(){$('out').classList.remove('show')}
$('oc').onclick=closeOut;$('out').onclick=e=>{if(e.target.id==='out')closeOut()};
async function showOut(blob,name){
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
  $('oi').src=url;$('oa').href=url;$('oa').download=name;
  const sh=$('os');
  if(navigator.share){sh.hidden=false;sh.onclick=async()=>{try{await navigator.share({files:[new File([blob],name,{type:blob.type})],title:name})}catch(e){}}}
  $('st').textContent='جاري الحفظ...';$('out').classList.add('show');
}
$('bDl').onclick=async()=>{
  const b=$('bDl'),lab=b.querySelector('span');
  b.disabled=true;b.classList.add('spin');lab.textContent='جاري التجهيز';
  try{
    try{await Promise.all([document.fonts.load('600 34px Cairo'),document.fonts.load('700 34px "Playfair Display"')])}catch(e){}
    let k=2;if(photo)k=Math.min(4,Math.max(2,Math.ceil(photo.nw/(photo.bw*photo.s))));
    while(W*k>8000)k--;
    const o=document.createElement('canvas');o.width=W*k;o.height=H*k;
    const c=o.getContext('2d');render(c,false,k);
    const blob=await new Promise(r=>o.toBlob(r,'image/png'));
    if(!blob){toast('تعذّر إنشاء الصورة');return}
    const name='esms-poster-'+o.width+'x'+o.height+'.png';
    await showOut(blob,name);
    let saved=false;
    try{
      const d=window.claude&&await Promise.race([claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),4000))]);
      if(d){await d.save({filename:name,data:blob});saved=true}
    }catch(err){}
    $('st').textContent=saved?'تم الحفظ ✓ ('+o.width+'×'+o.height+')':'الصورة جاهزة ('+o.width+'×'+o.height+'). اضغط «تنزيل»، أو اضغط على الصورة مطوّلًا واختر «حفظ الصورة».';
  }finally{
    b.disabled=false;b.classList.remove('spin');lab.textContent='تنزيل';
  }
};

const sig=$('sig');
document.querySelectorAll('#pa path,#pb path').forEach((p,i)=>p.style.setProperty('--i',i%6));
const replay=()=>{sig.classList.remove('draw');void sig.offsetWidth;sig.classList.add('draw')};
sig.addEventListener('pointerdown',replay);replay();
function boot(){
  const img=new Image();
  img.onload=()=>{ov=img;draw()};
  img.src=BANNER_SRC;
}
draw();boot();
document.fonts.ready.then(draw);
</script>
</body>
</html>
