s cubic-bezier(.3,1.6,.5,1) both;animation-delay:1.7s}\r\n@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}\r\n@keyframes fi{from{opacity:0;transform:scale(.2)}}\r\n@media (hover:hover){.sig:hover{transform:translateY(-3px)}}\r\n.sig:active{transform:scale(.95)}\r\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\r\n\n/* ---- شريط التنقل بين الصفحتين ---- */\n.pgnav{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.pgnav h1{margin:4px 2px 12px}\n.pgnav-link{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;margin:4px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px/1 Cairo,system-ui,sans-serif;text-decoration:none;white-space:nowrap;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.05);transition:border-color .25s,color .25s,transform .25s,box-shadow .25s}\n.pgnav-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s,color .2s}\n@media (hover:hover){.pgnav-link:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.10)}.pgnav-link:hover svg{transform:translateX(3px)}}\n.pgnav-link:active{transform:scale(.95)}\n.pgnav-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n</style>\r\n</head>\r\n<body>\r\n<header class=\"pgnav\"><h1><i></i>استوديو البوستر</h1><a class=\"pgnav-link\" href=\"#card\" data-go=\"card\" aria-label=\"العودة إلى الصفحة الأولى: بطاقة العضو\"><span>الصفحة الأولى</span><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/></svg></a></header>\r\n<div class=\"stage\"><canvas id=\"cv\"></canvas></div>\r\n<p class=\"hint\" id=\"hint\">اضغط على «إضافة صورة» لتبدأ.</p>\r\n\r\n<div class=\"sheet\" id=\"sheet\"><div><div class=\"in\">\r\n<label for=\"l1\">السطر الأول</label><input id=\"l1\" autocomplete=\"off\">\r\n<label for=\"l2\">
